<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Basic add and subtract operations</title>
    <link rel="icon" type="image/png" href="/assets/lm/14dia.png">

    <style>
        /* General Layout */
        * {
            box-sizing: border-box; 
        }

        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        /* --- Header Layout --- */
        .page-header {
            position: relative; 
            height: 160px;      
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            color: black; 
            padding: 0 15px;
            text-align: center;
        }

        .page-header h1 {
            position: relative;
            z-index: 10;
            margin: 0;
            font-size: 2rem;
        }

        /* --- Abacus Background --- */
        #abacus-group {
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 1; 
            display: flex; 
            width: 100%;
            height: 100%;
            overflow: hidden; 
        }

        #abacus-group img {
            width: 15px;
            height: 100%; 
            object-fit: fill; 
        }

        /* Navigation */
        nav {
            text-align: center;
            padding: 10px;
        }

        nav a {
            display: inline-block;
            padding: 12px 20px; 
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        /* Main Container */
        .main-container {
            background-color: #ffffff;
            width: 95%;           
            max-width: 500px;      
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: 0 auto 30px auto; 
            display: flex; 
            flex-direction: column;
            gap: 15px;
        }

        /* Input Rows */
        .input-layout {
            display: flex;
            gap: 10px;
            flex-wrap: wrap; 
        }

        .input-layout input {
            flex: 1;
            min-width: 120px;
            padding: 12px;    
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;  
        }

        /* Button Rows */
        .button-layout {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .button-layout button, .control-layout button, .main-container > button {
            padding: 12px 16px; 
            cursor: pointer;
            border: 1px solid #ccc;
            background-color: #e9e9e9;
            border-radius: 4px;
            transition: background-color 0.2s;
            font-size: 16px;
        }

        .button-layout button:hover, .control-layout button:hover:not(:disabled), .main-container > button:hover {
            background-color: #d4d4d4;
        }

        button:disabled {
            background-color: #f5f5f5;
            color: #a0a0a0;
            cursor: not-allowed;
        }

        /* Scroll Area & ASCII Container */
        .scroll-area {
            border: 1px solid #ccc;
            height: 40vh;          
            min-height: 250px;     
            max-height: 400px;     
            overflow-y: auto;
            overflow-x: auto;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            -webkit-overflow-scrolling: touch; 
        }

        .scroll-container {
            font-family: "Courier New", Courier, monospace;
            font-size: 18px;
            text-align: right;
            white-space: pre;
        }

        /* Labels */
        .label-layout {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #output_label, #rods_label {
            font-weight: bold;
            color: #333;
            word-wrap: break-word; 
        }

        /* Playback Controls */
        .control-layout {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        #btn_back {
            margin-top: 10px;
            font-weight: bold;
        }

        /* --- Mobile Breakpoints --- */
        @media (max-width: 480px) {
            .page-header h1 {
                font-size: 1.5rem;
            }
            
            .button-layout, .control-layout {
                flex-direction: column; 
            }
            
            .button-layout button, .control-layout button, .main-container > button {
                width: 100%; 
            }
            
            .scroll-container {
                font-size: 12px; 
            }
        }
    </style>
</head>

<body>
    
    <header class="page-header">
        <div id="abacus-group"></div>
        <h1>adding and subtracting integers</h1>
    </header>
    
    <nav><a href="index.html">← Back to Home</a></nav>
    
    <div class="main-container">
        
        <div class="input-layout">
            <input type="text" id="input_field1" placeholder="first input">
            <input type="text" id="input_field2" placeholder="second input">
        </div>

        <div class="button-layout">
            <button id="process_button">add</button>
            <button id="process_button3">-</button>
        </div>

        <div class="scroll-area">
            <div id="scroll_container" class="scroll-container"></div>
        </div>

        <div class="label-layout">
            <div id="output_label">output</div>
            <div id="rods_label">rods: 0</div>
        </div>

        <div class="control-layout">
            <button id="clear_button" disabled>Start</button>
            <button id="prev_button" disabled>Previous</button>
            <button id="next_button" disabled>Next</button>
            <button id="play_button" disabled>Play</button>
            <button id="stop_button" disabled>Pause</button>
        </div>

        <button id="btn_back">adding and subtracting digits in random order -></button>

    </div>
    
    <script>
        const container = document.getElementById('abacus-group');

        for (let i = 110; i > 0; i--) {
            let rodn = i % 3; 
            let rodNumber; 
            
            if (rodn == 2) {
                rodNumber = 0;
            } else if (rodn == 1) {
                rodNumber = 1;
            } else if (rodn == 0) {
                rodNumber = 2;
            }
            
            let img = document.createElement('img');
            img.src = `assets/${rodNumber}Rod4.png`;
            container.appendChild(img);
        }
    </script>
    
    <script type="module" src="./basicAddAndSubt.js"></script>
</body>
</html>
